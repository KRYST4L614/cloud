apiVersion: 1

# Persist infrastructure alerts in the backend; only alerts with user_id enter personal lists.
contactPoints:
  - orgId: 1
    name: cloud-backend
    receivers:
      - uid: cloud-backend-webhook
        type: webhook
        # Send recovery notifications so stored incidents can transition to resolved.
        disableResolveMessage: false
        settings:
          url: http://backend:8000/api/alerts/webhook
          httpMethod: POST
          authorization_scheme: Bearer
          # Must match the backend's ALERT_WEBHOOK_TOKEN environment variable.
          authorization_credentials: ${ALERT_WEBHOOK_TOKEN}

# Group related alerts and limit repeated notifications for ongoing incidents.
policies:
  - orgId: 1
    receiver: cloud-backend
    group_by: ["grafana_folder", "alertname"]
    group_wait: 10s
    group_interval: 30s
    repeat_interval: 1h
