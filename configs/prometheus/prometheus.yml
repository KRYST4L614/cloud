# Poll targets every 15 seconds; Grafana evaluates application alerts separately.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Collect HTTP, storage, authentication, and dependency metrics from /metrics.
  - job_name: backend
    static_configs:
      - targets: ["backend:8000"]

  # Gateway metrics are exposed through the StatsD-to-Prometheus bridge.
  - job_name: versitygw
    static_configs:
      - targets: ["statsd-exporter:9102"]

  # Collect Prometheus's own operational metrics.
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
