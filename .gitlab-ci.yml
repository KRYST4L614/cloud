workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_TAG'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main"'
    - when: never

stages: [test, lint, deploy]

default:
  tags: [cloud-docker]

.go:
  image: golang:1.26.0
  variables:
    GOPATH: "$CI_PROJECT_DIR/.cache/go"
    GOCACHE: "$CI_PROJECT_DIR/.cache/go-build"
  cache:
    key: "go-$CI_RUNNER_ID"
    paths:
      - .cache/
      - .bin/

test:
  extends: .go
  stage: test
  script:
    - make test

lint:
  extends: .go
  stage: lint
  script:
    - make lint

deploy:
  stage: deploy
  rules:
    - if: '$CI_COMMIT_TAG'
  image: docker:29.9.3-cli
  variables:
    # Runner and VPS must support the same platform; change for an ARM VPS.
    BUILD_PLATFORM: linux/amd64
  resource_group: production
  environment:
    name: production
  before_script:
    - apk add --no-cache openssh-client
  script:
    - sh scripts/build-release.sh
    - sh scripts/ci-deploy.sh
  artifacts:
    when: always
    paths: [release.tgz]
    expire_in: 14 days
