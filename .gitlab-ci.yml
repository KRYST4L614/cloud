workflow:
  rules:
    - if: '$CI_COMMIT_TAG'
    - when: never

stages: [verify, build, deploy]

default:
  tags: [cloud-docker]

verify:
  stage: verify
  image: golang:1.26.0
  variables:
    GOPATH: "$CI_PROJECT_DIR/.cache/go"
    GOCACHE: "$CI_PROJECT_DIR/.cache/go-build"
  cache:
    key: "go-$CI_RUNNER_EXECUTABLE_ARCH"
    paths:
      - .cache/
      - .bin/
  script:
    - go test ./...
    - make lint

build:
  stage: build
  image: docker:29.9.3-cli
  variables:
    # Runner and VPS must support the same platform; change for an ARM VPS.
    BUILD_PLATFORM: linux/amd64
  script:
    - sh scripts/build-release.sh
  artifacts:
    paths: [release.tgz]
    expire_in: 14 days

deploy:
  stage: deploy
  image: alpine:3.22
  needs:
    - job: build
      artifacts: true
  resource_group: production
  environment:
    name: production
  before_script:
    - apk add --no-cache openssh-client
  script:
    - sh scripts/ci-deploy.sh
