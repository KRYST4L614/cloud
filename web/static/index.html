<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cloud Storage</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <section id="auth-view" class="auth hidden">
    <div class="card auth-card">
      <h1>☁ Cloud Storage</h1>
      <div class="tabs">
        <button class="tab active" data-mode="login">Log in</button>
        <button class="tab" data-mode="register">Sign up</button>
      </div>
      <form id="auth-form" novalidate>
        <label>Email<input type="email" name="email" required autocomplete="email" aria-describedby="auth-error"></label>
        <label>Password<input type="password" name="password" required autocomplete="current-password" aria-describedby="auth-error"></label>
        <p class="error" id="auth-error" role="alert" aria-atomic="true"></p>
        <button type="submit" class="primary" id="auth-submit">Log in</button>
      </form>
    </div>
  </section>

  <section id="app-view" class="hidden">
    <header class="topbar">
      <div class="brand">☁ Cloud Storage</div>
      <nav class="tabs">
        <button class="tab active" data-view="files">Files</button>
        <button class="tab" data-view="alerts">Alerts <span id="alert-badge" class="badge hidden"></span></button>
      </nav>
      <div class="user">
        <div class="usage">
          <div class="usage-bar"><div id="usage-fill"></div></div>
          <small id="usage-text"></small>
        </div>
        <a href="/swagger/" target="_blank" rel="noopener">API</a>
        <span id="user-email"></span>
        <button id="logout">Log out</button>
      </div>
    </header>

    <main>
      <div id="files-view">
        <div class="toolbar">
          <input type="search" id="search" placeholder="Search by name…" aria-label="Search files by name">
          <label class="primary button">
            Upload files
            <input type="file" id="file-input" multiple hidden>
          </label>
        </div>

        <div id="dropzone" class="dropzone">Drag and drop files here to upload</div>
        <ul id="uploads" class="uploads"></ul>

        <table class="files">
          <thead>
            <tr><th>Name</th><th>Size</th><th>Uploaded</th><th></th></tr>
          </thead>
          <tbody id="file-list"></tbody>
        </table>
        <p id="empty" class="muted hidden">No files yet.</p>
      </div>

      <div id="alerts-view" class="hidden">
        <div class="toolbar">
          <p class="muted">Infrastructure alerts from Grafana, powered by Prometheus metrics.</p>
          <div class="links">
            <a id="grafana-link" target="_blank" rel="noopener">Grafana</a>
            <a id="prometheus-link" target="_blank" rel="noopener">Prometheus</a>
          </div>
        </div>
        <ul id="alert-list" class="alerts"></ul>
        <p id="alerts-empty" class="muted hidden">No alerts. All systems are operational.</p>
      </div>
    </main>
  </section>

  <div id="toast" class="toast hidden"></div>
  <script src="/app.js"></script>
</body>
</html>
