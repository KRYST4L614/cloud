server {
    listen 80;
    server_name _;
    # Keep redirects relative to preserve the externally published Docker port.
    absolute_redirect off;
    root /usr/share/nginx/html;

    # Let the backend enforce upload size and per-user quota limits.
    client_max_body_size 0;

    # Only /api/ is proxied to the backend; internal event routes remain private.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Stream uploads and downloads without staging complete files in nginx.
        proxy_request_buffering off;
        proxy_buffering off;
        # Allow long transfers; timeouts apply between successive I/O operations.
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # Normalize the documentation URL before proxying to Swagger UI.
    location = /swagger {
        return 301 /swagger/;
    }

    location /swagger/ {
        proxy_pass http://swagger-ui:8080;
        proxy_set_header Host $host;
    }

    location / {
        # Serve existing assets and fall back to the application entry page.
        try_files $uri /index.html;
    }
}
