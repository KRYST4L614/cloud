openapi: 3.0.3
info:
  title: Cloud Storage API
  version: 1.0.0
  description: |
    Cloud storage REST API. Files are stored in S3-compatible VersityGW,
    and metadata is stored in MongoDB.

    For protected endpoints, get a token from `/api/auth/login` or
    `/api/auth/register` and click **Authorize**.
servers:
  - url: /
tags:
  - name: auth
    description: Registration and login
  - name: files
    description: File management
  - name: public
    description: Public link access
  - name: alerts
    description: Grafana Alerting notifications
  - name: service
    description: Service endpoints

paths:
  /api/auth/register:
    post:
      tags: [auth]
      summary: Register a user
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Credentials' }
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409':
          description: User already exists
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/auth/login:
    post:
      tags: [auth]
      summary: Log in
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Credentials' }
      responses:
        '200':
          description: Logged in successfully
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/me:
    get:
      tags: [auth]
      summary: Current user and quota usage
      responses:
        '200':
          description: Profile
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/files:
    get:
      tags: [files]
      summary: List files
      description: Returns up to 1000 files belonging to the user, newest first.
      parameters:
        - name: q
          in: query
          description: Case-insensitive substring search by file name
          schema: { type: string }
      responses:
        '200':
          description: Files
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/File' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [files]
      summary: Upload a file
      description: |
        The file is streamed to object storage. Its size is limited by
        `MAX_UPLOAD_BYTES` and the remaining user quota.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '201':
          description: File uploaded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/File' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '413':
          description: File size limit or storage quota exceeded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/files/{id}:
    parameters:
      - $ref: '#/components/parameters/FileID'
    patch:
      tags: [files]
      summary: Rename a file
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, maxLength: 255, example: report-2026.pdf }
      responses:
        '204': { description: Renamed }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [files]
      summary: Delete a file
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/files/{id}/download:
    parameters:
      - $ref: '#/components/parameters/FileID'
    get:
      tags: [files]
      summary: Download a file
      description: |
        In addition to the `Authorization` header, accepts a token in the
        `access_token` parameter so files can be opened using a regular link.
      security:
        - bearerAuth: []
        - queryToken: []
      parameters:
        - name: inline
          in: query
          description: '`1` serves the file with `Content-Disposition: inline` for browser preview'
          schema: { type: string, enum: ['1'] }
      responses:
        '200':
          description: File contents
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/files/{id}/share:
    parameters:
      - $ref: '#/components/parameters/FileID'
    post:
      tags: [files]
      summary: Enable public access
      description: Creates a public link or returns the existing one.
      responses:
        '200':
          description: Public link
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ShareResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [files]
      summary: Revoke public access
      responses:
        '204': { description: Access revoked }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/public/{token}:
    get:
      tags: [public]
      summary: Download using a public link
      security: []
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string, example: 3f9c2a7d41b84e0c9d1a6b2e5f7c8a90 }
      responses:
        '200':
          description: File contents
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/alerts:
    get:
      tags: [alerts]
      summary: Latest 100 alerts
      responses:
        '200':
          description: Alerts, most recently updated first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Alert' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/alerts/webhook:
    post:
      tags: [alerts]
      summary: Receive Grafana alerts
      description: |
        Grafana Alerting contact point. Authenticates using the Bearer
        `ALERT_WEBHOOK_TOKEN` rather than a user JWT.
      security:
        - webhookToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GrafanaWebhook' }
      responses:
        '204': { description: Alerts saved }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503':
          description: MongoDB is unavailable; Grafana will retry delivery
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/openapi.yaml:
    get:
      tags: [service]
      summary: Get this specification
      security: []
      responses:
        '200':
          description: OpenAPI 3 in YAML format
          content:
            application/yaml:
              schema: { type: string }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    queryToken:
      type: apiKey
      in: query
      name: access_token
    webhookToken:
      type: http
      scheme: bearer

  parameters:
    FileID:
      name: id
      in: path
      required: true
      description: File identifier (MongoDB ObjectID)
      schema: { type: string, pattern: '^[0-9a-f]{24}$', example: 6ae7a8955350e665af6b7fd1 }

  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: Missing or invalid token, or invalid credentials
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: File not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    Error:
      type: object
      properties:
        error: { type: string, example: not found }

    Credentials:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email, example: user@example.com }
        password: { type: string, format: password, minLength: 8, maxLength: 72, example: password123 }

    TokenResponse:
      type: object
      properties:
        token: { type: string, description: JWT for the Authorization header }
        expires_at: { type: string, format: date-time }
        user: { $ref: '#/components/schemas/User' }

    User:
      type: object
      properties:
        id: { type: string, example: 6ae7a8955350e665af6b7fd0 }
        email: { type: string, format: email }
        quota_bytes: { type: integer, format: int64, example: 1073741824 }
        used_bytes: { type: integer, format: int64, example: 20000020 }
        created_at: { type: string, format: date-time }

    File:
      type: object
      properties:
        id: { type: string, example: 6ae7a8955350e665af6b7fd1 }
        name: { type: string, example: report.pdf }
        size: { type: integer, format: int64, example: 20000000 }
        content_type: { type: string, example: application/pdf }
        share_token:
          type: string
          description: Present only when public access is enabled
        created_at: { type: string, format: date-time }

    ShareResponse:
      type: object
      properties:
        share_token: { type: string }
        url: { type: string, example: /api/public/3f9c2a7d41b84e0c9d1a6b2e5f7c8a90 }

    Alert:
      type: object
      properties:
        id: { type: string }
        fingerprint: { type: string }
        name: { type: string, example: ObjectStorageDown }
        status: { type: string, enum: [firing, resolved] }
        severity: { type: string, example: critical }
        summary: { type: string }
        description: { type: string }
        labels:
          type: object
          additionalProperties: { type: string }
        starts_at: { type: string, format: date-time }
        ends_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    GrafanaWebhook:
      type: object
      description: Subset of the Grafana Alerting webhook payload
      properties:
        status: { type: string, enum: [firing, resolved] }
        alerts:
          type: array
          items:
            type: object
            properties:
              status: { type: string, enum: [firing, resolved] }
              labels:
                type: object
                additionalProperties: { type: string }
              annotations:
                type: object
                additionalProperties: { type: string }
              startsAt: { type: string, format: date-time }
              endsAt: { type: string, format: date-time }
              fingerprint: { type: string }

security:
  - bearerAuth: []
